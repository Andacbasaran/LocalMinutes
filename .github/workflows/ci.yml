name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install --upgrade pip && pip install ruff

      - name: Run Ruff lint check
        run: ruff check .

  test:
    name: Test (${{ matrix.os }}, Python 3.11)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linux PortAudio & Qt offscreen libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libportaudio2 \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt pytest

      - name: Byte-compile Python sources
        shell: bash
        run: |
          shopt -s nullglob
          python -m py_compile \
            main.py \
            localminutes/*.py \
            localminutes/audio/*.py \
            localminutes/export/*.py \
            localminutes/storage/*.py \
            localminutes/summarization/*.py \
            localminutes/transcription/*.py \
            localminutes/ui/*.py \
            localminutes/ui/widgets/*.py \
            scripts/*.py \
            tests/*.py

      - name: Run pytest suite
        run: pytest -v
