[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localminutes"
version = "0.1.0"
description = "%100 offline, toplantıya bot sokmayan canlı toplantı ve ders deşifre + özet stüdyosu."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6.0",
    "pyaudiowpatch>=0.2.12.6",
    "faster-whisper>=1.0.3",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
localminutes = "localminutes.app:main"

[tool.setuptools.packages.find]
include = ["localminutes*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

