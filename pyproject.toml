[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localminutes"
version = "1.0.0"
description = "100% offline, bot-free live meeting & lecture transcription, action items, local Q&A, and summary studio."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Andac Basaran" },
]
keywords = [
    "meeting",
    "transcription",
    "whisper",
    "faster-whisper",
    "offline",
    "privacy",
    "bot-free",
    "summarization",
    "ollama",
    "pyqt6",
    "sqlite-fts5",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Office/Business",
]
dependencies = [
    "PyQt6>=6.6.0",
    "pyaudiowpatch>=0.2.12.6; sys_platform == 'win32'",
    "sounddevice>=0.4.6",
    "scipy>=1.11.0",
    "faster-whisper>=1.0.3",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "pyinstaller>=6.0.0",
    "Pillow>=10.0.0",
]

[project.scripts]
localminutes = "localminutes.app:main"

[project.urls]
Homepage = "https://localminutes.andacbasaran.com"
Repository = "https://github.com/Andacbasaran/LocalMinutes"
Issues = "https://github.com/Andacbasaran/LocalMinutes/issues"
Changelog = "https://github.com/Andacbasaran/LocalMinutes/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["localminutes*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [
    ".venv",
    "build",
    "dist",
    "models",
    "release_out",
    "website",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]
