ShortDescription: 100% offline, bot-free live meeting & lecture transcription, action items, Q&A, and summary studio.
Description: >-
  LocalMinutes records microphone and system meeting audio natively without joining any
  meeting bot, transcribes locally on CPU with 0 MB VRAM via faster-whisper INT8 and
  anti-aliased polyphase resampling, stores searchable archives in SQLite FTS5, and delivers
  Granola-style private notes, persistent action items, Ask This Meeting BM25/Ollama Q&A,
  Strict Air-Gapped Privacy Mode, and Obsidian YAML Markdown / WebVTT / SRT / JSON exports.
